---
# Instructor Service
apiVersion: v1
kind: Service
metadata:
  name: instructor
  namespace: lms
spec:
  selector:
    app: instructor
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# Discount gRPC Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discountgrpc
  namespace: lms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discountgrpc
  template:
    metadata:
      labels:
        app: discountgrpc
    spec:
      containers:
      - name: discountgrpc
        image: your-registry/lms-discountgrpc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

---
# Discount gRPC Service
apiVersion: v1
kind: Service
metadata:
  name: discountgrpc
  namespace: lms
spec:
  selector:
    app: discountgrpc
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# Web Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: your-registry/lms-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: SERVICES__COURSEMANAGEMENT__HTTP
          value: "http://coursemanagement:80"
        - name: SERVICES__USERMANAGEMENT__HTTP
          value: "http://usermanagement:80"
        - name: SERVICES__INSTRUCTOR__HTTP
          value: "http://instructor:80"
        - name: SERVICES__DISCOUNT__GRPC
          value: "http://discountgrpc:80"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Web Application Service
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lms
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer

---
# Ingress (optional, for external access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms-ingress
  namespace: lms
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: "lms.example.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: "api.lms.example.com"
    http:
      paths:
      - path: /courses
        pathType: Prefix
        backend:
          service:
            name: coursemanagement
            port:
              number: 80
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: usermanagement
            port:
              number: 80
      - path: /instructors
        pathType: Prefix
        backend:
          service:
            name: instructor
            port:
              number: 80
